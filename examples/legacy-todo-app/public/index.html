<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>legacy-todo-app</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe4; font: 16px/1.45 Georgia, serif; color: #2b2622; }
  .card { width: min(360px, 88vw); background: #fffdf8; border: 2px solid #2b2622; box-shadow: 6px 6px 0 #2b2622; padding: 22px 22px 14px; }
  .kicker { margin: 0; font: 11px/1 monospace; letter-spacing: .08em; text-transform: uppercase; color: #8a7f74; }
  h1 { margin: 6px 0 14px; font-size: 26px; }
  form { display: flex; gap: 6px; }
  input:not([type]) { flex: 1; padding: 8px; border: 2px solid #2b2622; font: inherit; background: #fff; }
  form button { border: 2px solid #2b2622; background: #ffd65a; font: 600 14px monospace; padding: 0 12px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 14px 0 6px; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px dashed #cfc5b8; }
  li.done span { text-decoration: line-through; color: #9b9087; }
  li button { border: 0; background: none; font-size: 18px; cursor: pointer; color: #9b9087; }
  .count { font: 12px monospace; color: #8a7f74; }
</style>
</head>
<body>
<div id="root"></div>
__BUNDLE__
</body>
</html>
